server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS embebido de Docker: permite re-resolver "backend" en cada peticion, para que
    # recrear el contenedor del backend (nueva IP) no deje al frontend apuntando a la vieja.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # La app es una SPA (react-router): cualquier ruta desconocida sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El backend vive detrás de nginx, así que el navegador habla con el mismo origen
    # (sin CORS). proxy_pass con variable conserva la ruta /api/v1/... completa y fuerza
    # la re-resolución del nombre en cada petición.
    location /api/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos estáticos con cache largo (los nombres llevan hash del build).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
