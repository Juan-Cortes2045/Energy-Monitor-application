# Definicion de zonas de limitacion de tasa (Rate Limiting) frente a abusos DDoS y fuerza bruta
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Texto comprimido: el JS y el CSS del build bajan varias veces más livianos.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS embebido de Docker: permite re-resolver "gateway" en cada peticion, para que
    # recrear el contenedor del gateway (nueva IP) no deje al frontend apuntando a la vieja.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/snippets/security-headers.conf;

    # La app es una SPA (react-router): cualquier ruta desconocida sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html y el service worker nunca se cachean: tras un despliegue el navegador debe
    # pedir los nombres nuevos de los assets y la versión nueva del worker.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # La API vive detrás de nginx, así que el navegador habla con el mismo origen (sin CORS).
    # Todo /api/ va al API gateway, que lo reparte entre el servicio de seguridad y el backend.
    # proxy_pass con variable conserva la ruta /api/v1/... completa y fuerza la re-resolución
    # del nombre en cada petición.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        set $gateway_upstream gateway:8080;
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de proxy para mitigar ataques Slowloris / conexiones colgadas
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Proteccion estricta adicional para endpoints criticos de autenticacion
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        set $gateway_upstream gateway:8080;
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Archivos estáticos con cache largo (los nombres llevan hash del build).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
