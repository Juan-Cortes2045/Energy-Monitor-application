# Cabeceras de seguridad de la web. Se incluyen en cada location que define su propio
# add_header: en nginx un add_header dentro de un location anula todos los del server.
#
# Content-Security-Policy, solo lo que la app usa:
#   - Google Sign-In (initCodeClient): el script y los estilos de accounts.google.com/gsi y su
#     ventana emergente. No se fija Cross-Origin-Opener-Policy: same-origin rompería esa ventana.
#   - Banderas de idioma (react-country-flag con svg): imágenes de cdn.jsdelivr.net.
#   - La API va por el mismo origen (/api/), así que connect-src 'self' basta.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://cdn.jsdelivr.net; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
# Bluetooth: la web vincula los módulos por Web Bluetooth. Lo demás no se usa.
add_header Permissions-Policy "bluetooth=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
