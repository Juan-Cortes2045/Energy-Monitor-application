# CI: unit tests and the production build on every pull request and push to dev and main.
# CD: after a push to main, and once the "production" environment is approved, the server pulls
# main and rebuilds the frontend image (infra/deploy/deploy.sh on the VPS).
name: Web CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: ""

  deploy:
    name: Deploy to production
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://energy-monitor.tech
    concurrency:
      group: production-frontend
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is restricted on the server to infra/deploy/deploy.sh: the argument is the component.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" frontend

      - name: Smoke test
        run: curl -fsS https://energy-monitor.tech/ -o /dev/null
